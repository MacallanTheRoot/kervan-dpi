name: Kervan DPI Windows RC2 Fix04

on:
  push:
    branches:
      - release/windows-rc2-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-rc2:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Setup Windows Python 3.13 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\.venv\\Scripts\\python.exe -m pip install -r requirements-windows-rc.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\.venv\\Scripts\\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows unit and Qt tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\\.venv\\Scripts\\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\\.venv\\Scripts\\python.exe -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows EXE
        shell: cmd
        run: call build.bat

      - name: Inspect Windows EXE
        shell: pwsh
        run: |
          .\\.venv\\Scripts\\python.exe tools/windows/inspect_rc.py dist/Kervan-DPI.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable ZIP and checksums
        shell: pwsh
        run: |
          & .\\tools\\windows\\package_rc.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem dist -Filter 'Kervan-DPI.exe' -File)
          $zip = @(Get-ChildItem dist -Filter 'Kervan-DPI-*-windows-portable.zip' -File)
          $sha = @(Get-ChildItem dist -Filter 'Kervan-DPI-*-WINDOWS-SHA256SUMS.txt' -File)

          if ($exe.Count -ne 1 -or $zip.Count -ne 1 -or $sha.Count -ne 1) {
            throw "Required Windows RC2 artifacts are missing or ambiguous."
          }

          foreach ($item in ($exe + $zip + $sha)) {
            if ($item.Length -eq 0) { throw "Empty artifact: $($item.Name)" }
            Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256 |
              Format-List
          }

      - name: Upload Windows RC2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kervan-windows-rc2-fix04
          path: |
            dist/Kervan-DPI.exe
            dist/Kervan-DPI-*-windows-portable.zip
            dist/Kervan-DPI-*-WINDOWS-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
