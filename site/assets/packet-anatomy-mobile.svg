<svg xmlns="http://www.w3.org/2000/svg" width="335" height="494" viewBox="0 0 335 494" role="img" aria-labelledby="title desc">
  <title id="title">Packet fields and separate engine controls</title>
  <desc id="desc">A conceptual packet shown as four stacked labeled fields, with a possible DPI inspection bracket, followed by a separate Kervan DPI interface control and selected engine.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#15202a}
    .mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:.7px}
    .small{font-size:11px}.medium{font-size:14px}.large{font-size:18px;font-weight:600}
    .muted{fill:#59666c}.blue{fill:#08679f}.line{stroke:#aab3b4;stroke-width:1;fill:none}.ink{stroke:#15202a;stroke-width:1.2;fill:none}.accent{stroke:#08679f;stroke-width:2;fill:none}
  </style>
  <path class="line" d="M0 0H335M0 493H335"/>
  <text x="10" y="27" class="mono small muted">01 / IP · TCP / UDP · TLS / HTTP</text>
  <text x="10" y="56" class="large">IP / TCP / UDP</text>
  <path class="ink" d="M10 75H325"/>
  <path class="line" d="M10 75v8m26-8v5m26-5v5m26-5v5m26-5v8m26-8v5m26-5v5m26-5v5m26-5v8m26-8v5m26-5v5m26-5v5m26-5v8"/>
  <rect x="10" y="94" width="315" height="51" fill="#e3e8e6" stroke="#15202a" stroke-width="1"/>
  <rect x="10" y="145" width="315" height="51" fill="#edf0ed" stroke="#15202a" stroke-width="1"/>
  <rect x="10" y="196" width="315" height="51" fill="#dceaf1" stroke="#15202a" stroke-width="1"/>
  <rect x="10" y="247" width="315" height="51" fill="#f4f3ee" stroke="#15202a" stroke-width="1"/>
  <rect data-motion-stage="ip" x="10" y="94" width="315" height="51" fill="#08679f" opacity="0"/>
  <rect data-motion-stage="transport" x="10" y="145" width="315" height="51" fill="#08679f" opacity="0"/>
  <rect data-motion-stage="protocol" x="10" y="196" width="315" height="51" fill="#08679f" opacity="0"/>
  <text x="23" y="125" class="mono small muted">01</text><text x="82" y="126" class="large">IP</text>
  <text x="23" y="176" class="mono small muted">02</text><text x="82" y="177" class="large">TCP / UDP</text>
  <text x="23" y="227" class="mono small blue">03</text><text x="82" y="228" class="large">TLS / HTTP</text>
  <text x="23" y="278" class="mono small muted">04</text><text x="82" y="279" class="large">PAYLOAD</text>
  <path class="accent" d="M10 311v13h315v-13"/>
  <text x="167" y="343" text-anchor="middle" class="mono small blue">DPI ?</text>
  <path class="line" d="M10 364H325"/>
  <text x="10" y="390" class="mono small muted">02 / UI → ENGINE</text>
  <rect x="10" y="409" width="141" height="46" fill="#0b1724"/>
  <text x="80" y="436" text-anchor="middle" class="mono small" style="fill:#fff">KERVAN DPI / UI</text>
  <path data-motion-stage="link" class="accent" d="M151 432h32"/><path data-motion-stage="link" class="accent" d="m177 426 7 6-7 6"/>
  <rect x="184" y="409" width="141" height="46" fill="none" stroke="#0b1724" stroke-width="1"/>
  <rect data-motion-stage="control" x="184" y="409" width="141" height="46" fill="#08679f" opacity="0"/>
  <text x="254" y="436" text-anchor="middle" class="mono small">ENGINE</text>
</svg>
